[package]
name = "qsm-view"
version = "0.1.0"
edition = "2021"
description = "Bevy viewer for a saved QSM simulation"
license = "Apache-2.0"

[dependencies]
m3data = { path = "../m3data" }
m3path = { path = "../m3path" }
tokio = { version = "1", features = ["rt-multi-thread"] }
bevy = { version = "0.20.0", optional = true }
bevy_egui = { version = "0.43.1", optional = true }

[features]
default = []
view = ["dep:bevy", "dep:bevy_egui"]

[[bin]]
name = "qsm-view"
path = "src/main.rs"
required-features = ["view"]
